[project]
name = "pipeline-resistance"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tsingkk", email = "bodekangk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "nuitka>=2.6",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "zstandard>=0.25.0",
]

[tool.mypy]
exclude = [
    '^dist/',
    '^build/',
]


